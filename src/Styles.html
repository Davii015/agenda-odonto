<style>
  :root {

    --cyan: #20b8cf;

    --radius: 20px;
  }

  * { box-sizing: border-box; }

  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  button { cursor: pointer; }
  .material-symbols-rounded { font-size: 22px; line-height: 1; }

  .app-shell { min-height: 100vh; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 252px; padding: 28px 18px; background: rgba(255,255,255,.94); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px 28px; }
  .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: white; background: linear-gradient(145deg, var(--primary), var(--cyan)); box-shadow: 0 8px 20px rgba(20,121,201,.22); }

  .nav-item:hover { background: var(--surface-soft); color: var(--primary); }
  .nav-item.is-active { background: linear-gradient(100deg, #e4f3fc, #f0faff); color: var(--primary-dark); }
  .test-mode { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 13px; border-radius: 14px; background: #eafaf8; color: #197a67; }
  .test-mode strong, .test-mode small { display: block; }
  .test-mode strong { font-size: 12px; }
  .test-mode small { margin-top: 3px; color: #5a9085; font-size: 10px; }

  .main-content { min-height: 100vh; margin-left: 252px; padding: 34px clamp(24px, 4vw, 58px) 54px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 1240px; margin: 0 auto 28px; }

  .icon-button:hover { background: var(--surface-soft); }
  .view { display: none; max-width: 1240px; margin: 0 auto; animation: rise .24s ease both; }
  .view.is-active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .hero-card { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; padding: 30px; margin-bottom: 22px; border-radius: 26px; color: white; background: linear-gradient(125deg, #0e70bb 0%, #168dca 60%, #22b8cf 100%); box-shadow: 0 16px 36px rgba(20,121,201,.18); overflow: hidden; position: relative; }
  .hero-card::after { content: ''; position: absolute; width: 230px; height: 230px; border: 45px solid rgba(255,255,255,.07); border-radius: 50%; right: -80px; top: -120px; }
  .hero-card > * { position: relative; z-index: 1; }
  .hero-kicker { margin-bottom: 8px; font-size: 12px; font-weight: 700; opacity: .78; text-transform: uppercase; }
  .hero-card h2 { margin-bottom: 8px; max-width: 660px; font-size: clamp(22px, 4vw, 32px); letter-spacing: -.03em; }

  .stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px; }

  .stat-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: #e8f4fc; color: var(--primary); }

  .appointment-person strong { color: var(--navy); font-size: 13px; }
  .appointment-person small { margin-top: 4px; color: var(--muted); font-size: 11px; }

  .status-badge.confirmado { background: #e5f8f1; color: #197c61; }

  .section-tools { display: flex; justify-content: flex-end; margin-bottom: 14px; }
  .search-field { width: min(100%, 360px); display: flex; align-items: center; gap: 8px; padding: 0 13px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); color: var(--muted); }
  .search-field:focus-within { border-color: #8ec7e9; box-shadow: 0 0 0 3px rgba(20,121,201,.08); }
  .search-field input { width: 100%; padding: 11px 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 13px; }
  .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 1px 15px; scrollbar-width: none; }

  .primary-button, .secondary-button, .danger-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; transition: .16s ease; }
  .primary-button { border: 1px solid var(--primary); background: linear-gradient(120deg, var(--primary), #168ecb); color: white; box-shadow: 0 7px 17px rgba(20,121,201,.16); }
  .primary-button:hover { transform: translateY(-1px); box-shadow: 0 9px 20px rgba(20,121,201,.22); }
  .secondary-button { border: 1px solid #b8d9ec; background: white; color: var(--primary); }
  .danger-button { border: 1px solid #ffd0d0; background: #fff5f5; color: var(--danger); }
  .full-button { width: 100%; margin-top: 5px; }
  button:disabled { cursor: wait; opacity: .6; transform: none !important; }
  .example-box { margin-bottom: 18px; padding: 14px; border-radius: 13px; background: #eff8fc; color: #42677e; overflow-x: auto; font-size: 11px; line-height: 1.7; }
  .import-summary { margin-top: 18px; padding: 14px; border-radius: 13px; background: #ebf9f4; color: #22755f; font-size: 12px; }

  .log-footer { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }

  .settings-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 20px; align-items: start; }
  .settings-actions { display: grid; gap: 14px; }
  .action-card, .privacy-card { display: flex; gap: 14px; padding: 20px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
  .action-card > span, .privacy-card > span { color: var(--primary); }
  .action-card h3 { margin: 0 0 6px; color: var(--navy); font-size: 14px; }
  .action-card p, .privacy-card p { margin: 0 0 14px; color: var(--muted); font-size: 11px; line-height: 1.5; }
  .privacy-card { background: #ecf9f6; border-color: #d5eee8; color: #227661; }

  .empty-state { padding: 46px 20px; text-align: center; color: var(--muted); }

  .loading-overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(244,249,253,.92); color: var(--primary); font-size: 12px; font-weight: 600; transition: opacity .2s; }
  .app-shell:not(.is-loading) .loading-overlay { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader { width: 34px; height: 34px; border: 3px solid #d4eaf6; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast-region { position: fixed; top: 18px; right: 18px; z-index: 120; display: grid; gap: 9px; width: min(350px, calc(100vw - 36px)); }
  .toast { padding: 13px 15px; border-radius: 13px; background: var(--navy); color: white; box-shadow: 0 12px 30px rgba(24,59,86,.2); font-size: 12px; animation: toastIn .2s ease; }
  .toast.error { background: #b94747; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-5px); } }
  .modal-backdrop { position: fixed; inset: 0; z-index: 110; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(17,48,70,.43); backdrop-filter: blur(3px); }
  .modal-backdrop.is-open { display: flex; }
  .modal { position: relative; width: min(580px, 100%); max-height: calc(100vh - 36px); overflow-y: auto; padding: 26px; border-radius: 22px; background: white; box-shadow: 0 25px 70px rgba(17,48,70,.25); }
  .modal-close { position: absolute; top: 16px; right: 16px; }
  .modal-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }

  @media (max-width: 1050px) {

  @media (max-width: 760px) {

    .sidebar { display: none; }
    .main-content { margin-left: 0; padding: 22px 16px 34px; }
    .topbar { margin-bottom: 22px; }
    h1 { font-size: 26px; }
    .hero-card { grid-template-columns: 1fr; padding: 24px 21px; }
    .hero-number { min-width: 0; width: max-content; display: flex; gap: 8px; align-items: baseline; padding: 10px 15px; }
    .hero-number strong { font-size: 24px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 15px; }
    .stat-card strong { font-size: 22px; }
    .stat-grid .stat-card:first-child { grid-column: span 2; }
    .records-card { background: transparent; border: 0; box-shadow: none; overflow: visible; }
    .records-header { display: none; }
    .record-row { grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 10px; padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: white; box-shadow: var(--shadow); }
    .record-row > div:first-child { grid-column: 1 / 2; }
    .record-date, .record-time { display: inline; color: var(--muted); }

    .record-row .edit-button { grid-column: 2; grid-row: 1 / 4; align-self: center; }
    .form-card { padding: 21px 18px; }
    .confirmation-counters { gap: 9px; }
    .confirmation-counter { padding: 14px 11px; }
    .confirmation-counter strong { font-size: 22px; }
    .confirmation-counter span { font-size: 9px; }
    .mobile-nav { position: fixed; inset: auto 0 0; z-index: 80; display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px max(8px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); border-top: 1px solid var(--border); background: rgba(255,255,255,.96); box-shadow: 0 -8px 28px rgba(34,94,132,.08); backdrop-filter: blur(12px); }
    .mobile-nav-item { min-width: 0; display: grid; justify-items: center; gap: 4px; padding: 5px 3px; border: 0; background: transparent; color: #7a91a2; }
    .mobile-nav-item small { font-size: 9px; font-weight: 600; }
    .mobile-nav-item.is-active { color: var(--primary); }
    .mobile-new .material-symbols-rounded { width: 40px; height: 40px; display: grid; place-items: center; margin-top: -22px; border: 4px solid var(--bg); border-radius: 14px; background: linear-gradient(140deg, var(--primary), var(--cyan)); color: white; box-shadow: 0 6px 14px rgba(20,121,201,.2); }
    .more-menu { position: fixed; right: 13px; bottom: 76px; z-index: 85; width: 190px; padding: 8px; border: 1px solid var(--border); border-radius: 16px; background: white; box-shadow: 0 16px 45px rgba(24,59,86,.18); }
    .more-menu.is-open { display: grid; }
    .more-menu button { display: flex; align-items: center; gap: 10px; padding: 11px; border: 0; border-radius: 10px; background: transparent; color: var(--text); font-size: 12px; text-align: left; }
    .more-menu button:hover { background: var(--surface-soft); }
    .section-tools, .search-field { width: 100%; }
    .logs-tools { justify-content: stretch; }
    .modal { padding: 22px 18px; }
  }

  @media (max-width: 430px) {
    .field-row { grid-template-columns: 1fr; gap: 0; }
    .appointment-row { grid-template-columns: 58px 1fr; }
    .appointment-row .status-badge { grid-column: 2; width: max-content; }
    .confirmation-counter span { min-height: 23px; display: block; }
    .modal-actions { flex-direction: column-reverse; }
    .modal-actions button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
